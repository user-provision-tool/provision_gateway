version: "3.8"

services:
  subnet-acl-gateway:
    build:
      context: ./provision-gateway
      dockerfile: Dockerfile
    container_name: subnet-acl-gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8870}:8770"
    volumes:
      # The parent stays rw (SOURCE_PROJECTS_DIR generation/fix/save-generated
      # and gateway_data); ONLY the keyring subtree is read-only (R8.6).
      - ${PROVISION_DIR:-/srv/provision_subnet_acl}:${PROVISION_DIR:-/srv/provision_subnet_acl}
      - ${PROVISION_DIR:-/srv/provision_subnet_acl}/keys:${PROVISION_DIR:-/srv/provision_subnet_acl}/keys:ro
    environment:
      - PROVISION_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}
      - GATEWAY_DATA_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}/gateway_data
      - PROVISION_API_URL=http://subnet-acl-provision-api:8000
      - GATEWAY_SECRET_KEY=${GATEWAY_SECRET_KEY:-dev-secret-change-me-in-production-32chars!}
      - NGINX_HTTP_PORT=${NGINX_HTTP_PORT:-8080}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-8443}
      # The ONE shared stream door an exposure URL is dialled on (task-doc R8.1):
      # the edge's published port in fullset. The minimal shape has no gateway.
      - STREAM_PORT=${STREAM_PORT:-17687}
      - DOCKER_OPS_LOG=${PROVISION_DIR:-/srv/provision_subnet_acl}/generated/docker_ops.log
      # G80 — fullset is ACL-on; the switch is gone from the deployment and the
      # gateway forces it true internally.
      - REGISTRY_FILE=${PROVISION_DIR:-/srv/provision_subnet_acl}/generated/user_registry.yml
      # T1 — the gateway schema is the live store; the registry schema is read
      # on demand by the gateway_reader role over the same connection.
      - DATABASE_URL=postgresql+psycopg://gateway_app:${GATEWAY_DB_PASSWORD:-gateway_app_pw}@subnet-acl-postgres:5432/${POSTGRES_DB:-subnet_acl}
      - GATEWAY_READER_DATABASE_URL=postgresql+psycopg://gateway_reader:${GATEWAY_READER_DB_PASSWORD:-gateway_reader_pw}@subnet-acl-postgres:5432/${POSTGRES_DB:-subnet_acl}
      - PROVISION_COOKIE_TTL=${PROVISION_COOKIE_TTL:-604800}
      # G83 — the cross service network. The gateway writes the dnsmasq config
      # through the shared PROVISION_DIR volume and calls the -api with these
      # opaque values; the static IPs are the cross-network assignments below.
      - CROSS_NETWORK=${CROSS_NETWORK:-subnet_acl_cross}
      - CROSS_RESOLVER_IP=${CROSS_RESOLVER_IP:-172.28.0.3}
      - CROSS_NGINX_IP=${CROSS_NGINX_IP:-172.28.0.2}
      - CROSS_CONFIG_DIR=${PROVISION_DIR:-/srv/provision_subnet_acl}/cross
      - CROSS_TASK_TIMEOUT_SEC=${CROSS_TASK_TIMEOUT_SEC:-30}
      - CROSS_TASK_RETRIES=${CROSS_TASK_RETRIES:-3}
    networks:
      # Static IP pin: the edge (subnet-acl-nginx-acl) resolves the DNS name
      # 'subnet-acl-gateway' at startup and caches the peer for the container's
      # lifetime. Without a pin, any gateway recreate can move the container to a
      # new IP and silently break every edge -> gateway proxy hop (502) until the
      # edge is restarted (cycle 20260901T102115Z GAP-22). Pin keeps the IP stable.
      subnet_acl_shared:
        ipv4_address: 172.17.0.4
      # G83 — the gateway is a cross-network member (so a source container can
      # reach its API). Subordinate to the platform network: the shared network
      # stays the container's top network.
      subnet_acl_cross:
        ipv4_address: 172.28.0.4
        gw_priority: -1
    restart: unless-stopped

  subnet-acl-dashboard:
    build:
      context: ./provision-dashboard
      dockerfile: Dockerfile
    container_name: subnet-acl-dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8775}:80"
    networks:
      - subnet_acl_shared
    restart: unless-stopped

  subnet-acl-mcp:
    build:
      context: ./provision-mcp
      dockerfile: Dockerfile
    container_name: subnet-acl-mcp
    environment:
      - GATEWAY_URL=http://subnet-acl-gateway:8770
      - GATEWAY_SECRET_KEY=${GATEWAY_SECRET_KEY:-dev-secret-change-me-in-production-32chars!}
    networks:
      - subnet_acl_shared
    restart: unless-stopped
    # No host port — internal use only. External agents reach via subnet_acl_shared.

  # v5 edge — the ONLY externally-exposed nginx in fullset (decision 1/6).
  # TLS termination (SNI→SSL_DIR cert map), portal routing, and the L7 ACL gate.
  # Spec §4.1; deviation: templates are mounted FILE-level (not whole-dir) so the
  # image-baked placeholder cert at /etc/nginx/acl/placeholder/ survives the mount
  # (a whole-dir bind-mount would hide it — decision 11).
  subnet-acl-nginx-acl:
    build:
      context: ./nginx.acl
      dockerfile: Dockerfile
    # Pin the image name so `docker compose up` reuses the existing built image
    # (subnet-acl-nginx-acl:latest) instead of re-building under a
    # project-prefixed name (needs no network/apk for a no-op recreate).
    image: subnet-acl-nginx-acl:latest
    container_name: subnet-acl-nginx-acl
    ports:
      # NGINX_* = the client-facing ports, reused for the edge (decision 10) —
      # the same values the gateway reads for /go/, service-URL display, system-info.
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
      # The ONE shared stream door (task-doc R8.1): every exposure URL is dialled
      # here, and this is the ONLY host door to the stream path in fullset — the
      # internal nginx's own stream publish is suppressed by the base compose
      # (see _users_provision/docker-compose.provision.yml).
      - "${STREAM_PORT:-17687}:${STREAM_PORT:-17687}"
    volumes:
      - ./nginx.acl/edge.conf.template:/etc/nginx/acl/edge.conf.template:ro
      - ./nginx.acl/acl-helpers.conf.template:/etc/nginx/acl/acl-helpers.conf.template:ro
      - ./nginx.acl/entrypoint.sh:/etc/nginx/acl/entrypoint.sh:ro
      # The stream gate's njs hook (T7). Mounted like the templates so a change
      # arrives by RESTART (the entrypoint re-renders nothing — the hook is read
      # by nginx itself at `js_import` time, i.e. on (re)load).
      - ./nginx.acl/stream-acl.js:/etc/nginx/acl/stream-acl.js:ro
      # SSL_DIR → /certs (per-domain certs + portal cert). Read-only: the edge is
      # the key-holder (decision 17, GAP-15) — certs are the user's concern.
      - ${PROVISION_DIR:-/srv/provision_subnet_acl}/ssl:/certs:ro
    environment:
      - PORTAL_MODE=${PORTAL_MODE:-http}
      - PORTAL_HOSTNAME=${PORTAL_HOSTNAME:-portal.localhost}
      - PORTAL_SCHEME=${PORTAL_SCHEME:-http}
      - PORTAL_REDIRECT_PORT=${PORTAL_REDIRECT_PORT:-}
      - HTTPS_REDIRECT_PORT=${HTTPS_REDIRECT_PORT:-}
      # G80 — no ENABLE_ACL: the edge renders ACL-on by default. The ACL-off
      # branch remains in edge.conf.template/entrypoint.sh, unreachable.
    command: /bin/sh /etc/nginx/acl/entrypoint.sh
    user: nginx  # non-root (decision 17)
    networks:
      - subnet_acl_shared
    restart: unless-stopped

  # G83 — the cross resolver: dnsmasq on the cross network, no host network,
  # no upstream. It answers ONLY the service-domain wildcards the gateway writes
  # (`*.{domain} -> cross nginx`); every out-of-zone name is REFUSED so the
  # client falls through to 127.0.0.11.
  subnet-acl-cross-resolver:
    build:
      context: ./cross-resolver
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: subnet-acl-cross-resolver
    volumes:
      # A DIRECTORY mount, not a single file: the gateway replaces the file
      # atomically (tmp + rename), and a file bind-mount would keep the old inode.
      - ${PROVISION_DIR:-/srv/provision_subnet_acl}/cross/dnsmasq.d:/etc/dnsmasq.d:ro
    networks:
      subnet_acl_cross:
        ipv4_address: 172.28.0.3
    restart: unless-stopped

  # G83 — the cross nginx: the private edge replica. Same image and service
  # server blocks, `_auth_cross` instead of `_auth_jwt`, the target Basic always
  # injected, cross + shared networks, no host ports, no public exposure.
  subnet-acl-cross-nginx:
    image: subnet-acl-nginx-acl:latest
    container_name: subnet-acl-cross-nginx
    volumes:
      - ./nginx.acl/cross.conf.template:/etc/nginx/acl/cross.conf.template:ro
      - ./nginx.acl/cross-helpers.conf.template:/etc/nginx/acl/cross-helpers.conf.template:ro
      - ./nginx.acl/cross-stream-acl.js:/etc/nginx/acl/cross-stream-acl.js:ro
      - ./nginx.acl/entrypoint.sh:/etc/nginx/acl/entrypoint.sh:ro
      - ${PROVISION_DIR:-/srv/provision_subnet_acl}/ssl:/certs:ro
    environment:
      - EDGE_TEMPLATE=/etc/nginx/acl/cross.conf.template
      - HELPERS_TEMPLATE=/etc/nginx/acl/cross-helpers.conf.template
      - HELPERS_OUT=/etc/nginx/acl/cross-helpers.conf
      # G85 — the cross nginx's SERVING ports are the edge's client-facing
      # numbers (the same URL string on both doors), never published here.
      - NGINX_HTTP_PORT=${NGINX_HTTP_PORT:-80}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-443}
      - STREAM_PORT=${STREAM_PORT:-17687}
    command: /bin/sh /etc/nginx/acl/entrypoint.sh
    user: nginx
    networks:
      subnet_acl_shared: {}
      # The static cross-network IP is what the dnsmasq wildcard targets and
      # what the gateway trusts as the cross-verify caller.
      subnet_acl_cross:
        ipv4_address: 172.28.0.2
        gw_priority: -1
    restart: unless-stopped

networks:
  subnet_acl_shared:
    external: true
    name: ${SHARED_NETWORK:-subnet_acl_shared}
  # G83 — the dedicated cross network. A free private range outside the shared
  # 172.17.0.0/16 and the tenant pools (100.96/97.0.0/16).
  subnet_acl_cross:
    name: ${CROSS_NETWORK:-subnet_acl_cross}
    driver: bridge
    ipam:
      config:
        - subnet: ${CROSS_SUBNET:-172.28.0.0/24}
