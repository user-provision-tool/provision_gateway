# provision-dashboard nginx.conf
server {
    listen 80;
    server_name localhost;

    # React SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to gateway
    location /api/ {
        proxy_pass http://subnet-acl-gateway:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE support for log streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Service access redirect (GET /go/{hostname}) → gateway /api/auth/go/{hostname}
    location /go/ {
        rewrite ^/go/(.*) /api/auth/go/$1 break;
        proxy_pass http://subnet-acl-gateway:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
